[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky-trust-safety"
version = "0.1.0"
description = "Production-minded Bluesky Trust and Safety platform"
readme = "project-brief.md"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: tests that do not require external services",
    "integration: tests that require Redis, PostgreSQL, or MLflow",
    "e2e: tests that exercise the complete pipeline",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]